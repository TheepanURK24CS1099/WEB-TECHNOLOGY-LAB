<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Technology Lab</title>
    <style>
        :root {
            --bg: #f4f6fb;
            --card: #ffffff;
            --primary: #4a148c;
            --accent: #7b1fa2;
            --text: #1f2937;
            --muted: #6b7280;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff 0%, #fdf2f8 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .container {
            width: min(900px, 92%);
            margin: 40px auto;
            background: var(--card);
            border-radius: 16px;
            padding: 36px 28px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
            border: 1px solid #e5e7eb;
        }

        h1 {
            margin: 0 0 10px;
            text-align: center;
            color: var(--primary);
            font-size: 2rem;
        }

        .subtitle {
            text-align: center;
            color: var(--muted);
            margin: 0 0 24px;
        }

        .student-info {
            text-align: center;
            margin-bottom: 28px;
            line-height: 1.8;
        }

        .links {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 14px;
        }

        .links a {
            text-decoration: none;
            text-align: center;
            background: var(--accent);
            color: #fff;
            padding: 12px;
            border-radius: 10px;
            font-weight: 700;
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .links a:hover {
            background: var(--primary);
            transform: translateY(-2px);
        }

        footer {
            margin-top: auto;
            text-align: center;
            color: #4b5563;
            padding: 18px 10px 26px;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>Web Technology Lab</h1>
        <p class="subtitle">GitHub Pages Lab Exercise Record</p>

        <div class="student-info">
            <div><strong>Student Name:</strong> THEEPAN SS</div>
            <div><strong>Register Number:</strong> URK24CS1099</div>
        </div>

        <div class="links">
            <a href="ex1/">Exercise 1</a>
            <a href="ex2/">Exercise 2</a>
            <a href="ex3/">Exercise 3</a>
            <a href="ex4/">Exercise 4</a>
            <a href="ex5/">Exercise 5</a>
        </div>
    </main>

    <footer>
        © 2026 THEEPAN SS | URK24CS1099 | Web Technology Lab
    </footer>
</body>
</html>
